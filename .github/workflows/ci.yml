name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # next 16: >=20.9, jsdom 30: ^22.22 → Node 22 LTS
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # OpenAI 키 없이 통과해야 한다 — 테스트는 LLM 클라이언트를 가짜로 대체한다
      - run: npm run build
